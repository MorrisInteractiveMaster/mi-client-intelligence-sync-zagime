name: Validate application and local security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validate-m8-build.cjs
      - run: node --test scripts/validate-m8-build.test.cjs
      - run: bash -n scripts/verify-staging-iam.sh scripts/test-staging-iam-collector.sh
      - run: bash scripts/test-staging-iam-collector.sh
      - run: bash -n scripts/m8-staging.sh scripts/test-m8-staging.sh
      - run: bash scripts/test-m8-staging.sh
      - name: Check production runbook Bash syntax without executing commands
        run: awk '/^```bash$/ { in_bash=1; next } /^```$/ { in_bash=0 } in_bash' docs/production-launch-runbook.md | bash -n
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:server
      - run: npm run test:security
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
      - name: Reproduce the reviewed deployed image source in a real browser
        if: github.event_name == 'pull_request' && github.event.pull_request.base.sha == '1ef561b733bf3cc44925c08ab0cc8f153cab0801'
        run: |
          git fetch --depth=1 origin 1ef561b733bf3cc44925c08ab0cc8f153cab0801
          mkdir -p /tmp/mi-preview-baseline
          git archive 1ef561b733bf3cc44925c08ab0cc8f153cab0801 | tar -x -C /tmp/mi-preview-baseline
          docker build -f /tmp/mi-preview-baseline/deployment/Dockerfile -t mi-preview-baseline /tmp/mi-preview-baseline
          docker network create --internal mi-preview-baseline-net
          docker run -d --network mi-preview-baseline-net --name mi-preview-baseline -e BACKEND_MODE=staging -e STAGING_PREVIEW_ONLY=true mi-preview-baseline
          CONTAINER_HOST="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mi-preview-baseline)"
          trap 'docker rm -f mi-preview-baseline; docker network rm mi-preview-baseline-net' EXIT
          BASE="http://$CONTAINER_HOST:8080"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "$BASE/health" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --max-time 2 "$BASE/health" || { docker logs mi-preview-baseline; exit 1; }
          CONTAINER_HOST="$CONTAINER_HOST" BROWSER_EVIDENCE_DIR=test-results/baseline node scripts/smoke-preview.cjs http://127.0.0.1:8088 --expect-broken
      - name: Build staging container and verify actual browser rendering
        run: |
          docker build -f deployment/Dockerfile -t mi-m8-local .
          docker network create --internal mi-preview-fixed-net
          docker run -d --network mi-preview-fixed-net --name mi-m8-preview -e BACKEND_MODE=staging -e STAGING_PREVIEW_ONLY=true -e ENABLE_LIVE_FIREBASE=false -e ENABLE_SYNTHETIC_STAGING=false mi-m8-local
          CONTAINER_HOST="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mi-m8-preview)"
          trap 'docker rm -f mi-m8-preview; docker network rm mi-preview-fixed-net' EXIT
          BASE="http://$CONTAINER_HOST:8080"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "$BASE/health" > /tmp/mi-m8-health.json; then break; fi
            sleep 1
          done
          curl --fail --silent --max-time 2 "$BASE/health" > /tmp/mi-m8-health.json || { docker logs mi-m8-preview; exit 1; }
          node -e 'const r=require("/tmp/mi-m8-health.json");if(r.status!=="inactive-preview")process.exit(1)'
          CONTAINER_HOST="$CONTAINER_HOST" BROWSER_EVIDENCE_DIR=test-results/fixed node scripts/smoke-preview.cjs http://127.0.0.1:8089
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-container-browser-evidence
          path: test-results/
          if-no-files-found: ignore
