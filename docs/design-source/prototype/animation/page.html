<!-- REVIEW ONLY: this bar is for Dan and Dev. It is hidden when the address ends in ?client, and is removed for the real build. -->
<div class="review" role="region" aria-label="Review controls, not shown to clients">
  <span class="rv-tag">Review only</span>
  <div class="rv-group"><span>Style</span><div id="styles"></div></div>
  <div class="rv-group"><span>Data</span><div id="datasets"></div></div>
  <span id="now" class="rv-now"></span>
</div>

<header class="bar"><div class="bar-in"><img src="{{ZAGIME}}" alt="Zagimē Anishinabēk"><span>Partnership dashboard</span></div></header>
<main class="page">
  <section class="glance-card">
    <div>
      <p class="kicker">Partnership Pulse</p>
      <h1>Your partnership in 30 seconds</h1>
      <p class="lede">An animated recap of hours delivered, agreements, decisions and what's next. Built from the latest hours in QuickBooks.</p>
    </div>
    <button id="glance" class="glance" type="button"><span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span><span class="glance-txt"><b>At a glance</b><small>Play the 30-second recap</small></span></button>
  </section>
  <p class="placeholder">The rest of the dashboard sits below this card.</p>
</main>

<div id="player" class="player" hidden role="dialog" aria-modal="true" aria-label="Partnership Pulse recap">
  <div class="frame">
    <canvas id="stage" aria-label="Animated recap of the partnership"></canvas>
    <div class="controls">
      <button id="pp" type="button">Pause</button><button id="restart" type="button">Restart</button><button id="snd" type="button" aria-pressed="false" aria-label="Mute sound">Sound on</button>
      <div id="segs" class="segs"></div><span id="time" class="time"></span>
      <button id="close" type="button" aria-label="Close recap">Close ✕</button>
    </div>
  </div>
</div>
