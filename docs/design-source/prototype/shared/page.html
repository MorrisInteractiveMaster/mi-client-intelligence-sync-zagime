<!-- REVIEW ONLY: for Dan and Dev. Hidden when the address ends in ?client. Not part of the client build. -->
<div class="review" role="region" aria-label="Review controls, not shown to clients">
  <span class="rv-tag">Review only</span>
  <div class="rv-group"><span>Design</span><div id="rv-opts"></div></div>
  <div class="rv-group"><span>Data</span><div id="rv-sets"></div></div>
  <span id="rv-note" class="rv-note"></span>
</div>
<div id="app"></div>
<div id="panel" class="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div id="panel-scrim" class="panel-scrim"></div>
  <aside class="panel-sheet"><button id="panel-close" class="panel-close" type="button" aria-label="Close project">Close ✕</button><div id="panel-body"></div></aside>
</div>
<div id="player" class="player" hidden role="dialog" aria-modal="true" aria-label="At a glance recap">
  <div class="frame"><canvas id="stage" aria-label="Animated recap of the partnership"></canvas>
    <div class="controls"><button id="pp" type="button">Pause</button><button id="restart" type="button">Restart</button><button id="snd" type="button" aria-pressed="false">Sound on</button><div id="segs" class="segs"></div><button id="pclose" type="button">Close ✕</button></div></div>
</div>
<div id="tip" role="tooltip" hidden></div>
