# Explicit owner-approved image build only. No deployment or IAM changes.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deployment/Dockerfile
      - -t
      - '${_IMAGE}'
      - --build-arg
      - 'VITE_FIREBASE_API_KEY=${_API_KEY}'
      - --build-arg
      - 'VITE_FIREBASE_APP_ID=${_APP_ID}'
      - --build-arg
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_AUTH_DOMAIN}'
      - --build-arg
      - 'VITE_MORRIS_ENTRA_TENANT_ID=${_ENTRA_TENANT}'
      - .
images: ['${_IMAGE}']
timeout: 900s
